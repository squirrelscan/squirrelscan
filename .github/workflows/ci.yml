name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_TELEMETRY: "1"

jobs:
  # Docs-only changes (everything under docs/) skip the code jobs. This is
  # job-level gating on purpose, NOT `on.push.paths`: a filtered-out push
  # produces no CI run at all, so every ruleset-required check would sit at
  # "Expected" forever and the PR could never merge. A skipped job satisfies a
  # required check; an absent one does not.
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          # Unknown base (first push, force-push, empty sha) → run everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if [ -z "$changed" ] || echo "$changed" | grep -qv '^docs/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change: skipping code jobs"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Format, lint, and typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      # First: it takes ~20ms and it is the check that explains itself. Fails if
      # a test file lands outside every suite, if two suites would run the same
      # file, if a named suite points at a package that no longer exists, or if
      # the CLI tests job stops matching scripts/test-suites.ts.
      - name: Check every test suite is wired into CI
        run: bun run scripts/test-suites.ts --check
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck all workspaces
        run: bun run typecheck
      - name: Check third-party notices
        run: bun run notices:check
      # Marketplace listings read plugin.json / .claude-plugin from the default
      # branch, so drift here is publicly visible. Checked on every PR because
      # nothing else notices until someone reads the repo.
      - name: Check plugin manifests are in sync
        run: bun run scripts/sync-plugin-manifests.ts --check

  # ---------------------------------------------------------------------------
  # Which test suites run where (#1670):
  #
  #   CLI tests (this job)  every test file in the repo, one step per suite.
  #                         This job was a single bare `bun test`, which walks the
  #                         WHOLE tree — packages/* already gated every PR, just
  #                         invisibly, under a job named for apps/cli. The steps
  #                         below run exactly that set; a red step now names the
  #                         package. `rest` is the complement of the named suites,
  #                         so a new package is covered the day it lands.
  #   Audit engine golden   packages/audit-engine golden/streaming/redirect/deadline
  #                         files, again, on their own — a corpus regression is
  #                         unreadable inside a 400-file log.
  #   Release tooling       scripts/release-version.test.ts, again, next to the
  #                         changelog shell test.
  #   release.yml           still one bare whole-tree `bun test` before a release.
  #
  # The last three deliberately re-run files the steps below already cover.
  #
  # "Every test file" means what bun discovers: *.test.* / *.spec.* / *_test.* /
  # *_spec.* with a js/ts extension, any case, outside dot-directories.
  # scripts/test-suites.ts owns that definition and the split; the quality job's
  # --check step fails if the two ever disagree.
  #
  # Do NOT swap these for `bun run test`: that script is `cd apps/cli && bun test`
  # and would drop every package. The job name is fixed by the "CLI tests"
  # required status check in the repo ruleset; renaming it means updating the
  # ruleset in the same change or every PR blocks on a check that never reports.
  #
  # Wall time, measured on run 33955204147 (400 files, 251.6s total):
  #   audit-engine 143.0s · crawler 60.9s · cli 24.5s · rest 20.4s
  #   rules 2.5s · report 0.2s
  # Sequential steps keep that total unchanged. Cheapest first, so a fast suite
  # still reports if the slow one exhausts timeout-minutes. A parallel matrix
  # would cut the job to ~160s but renames the check per suite, hence a ruleset
  # edit; not worth it for one job on the critical path.
  # ---------------------------------------------------------------------------
  cli-tests:
    name: CLI tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/setup-bun
      # Every suite runs even when an earlier one is red, the way the single bare
      # `bun test` reported every failure at once; each still fails the job. The
      # setup guard keeps a broken toolchain to one red step instead of six.
      - name: Report tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run scripts/test-suites.ts --run report
      - name: Rules tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run scripts/test-suites.ts --run rules
      - name: Remaining package and script tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run scripts/test-suites.ts --run rest
      - name: apps/cli tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run scripts/test-suites.ts --run cli
      - name: Crawler tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run scripts/test-suites.ts --run crawler
      - name: Audit engine tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run scripts/test-suites.ts --run audit-engine

  installer-scripts:
    name: Installer script syntax
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # install.ps1 only ever runs on Windows machines, and the install test
      # workflow fetches the PUBLISHED script from main — so nothing here ever
      # parsed a change to it before users did. pwsh ships on the ubuntu runner
      # and exposes the same parser Windows PowerShell uses.
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './install.ps1').Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host 'install.ps1 parsed clean'
      # Parsing proves only that the file is syntactically PowerShell. This runs
      # the download helpers themselves against a stubbed Invoke-WebRequest, so
      # a change to the two-source fallback (#2064) can't reach Windows users
      # unexecuted the way the install-test workflow allows (it fetches the
      # PUBLISHED script from main, never the tree under test).
      - name: Check install.ps1 behaviour
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/install-ps-contract.test.ps1
      - name: Parse install.sh
        run: bash -n install.sh

  dependency-audit:
    name: Dependency audit
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun run audit:dependencies

  engine-tests:
    name: Audit engine golden tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun run test:engine

  release-tooling:
    name: Release tooling tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun run test:release

  # Runs on every change (docs cross-reference rule ids and CLI flags), and is
  # the only build job a docs-only change triggers. Deliberately not behind
  # `quality`: nothing in docs:check depends on the code lint passing.
  docs:
    name: Docs check and build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun run docs:check
      - run: bun run docs:build

  build:
    name: Compile CLI
    needs: [cli-tests, engine-tests, release-tooling]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun run build

  psl-freshness:
    name: Public suffix data freshness
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun run check:psl-freshness

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install detect-secrets==1.5.0
      - name: Reject new secret candidates
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
