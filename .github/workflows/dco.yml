name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  signoff:
    name: Verify commit sign-offs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check DCO sign-offs
        env:
          # The PR's author, NOT github.actor. github.actor is whoever
          # triggered *this run*, so it flips to a human the moment anyone
          # rebases, updates, or re-runs a dependabot PR, silently revoking
          # the exemption below and failing a PR that passed when opened.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          while read -r commit; do
            [ -n "$commit" ] || continue
            # Raw identities (%an/%ae), NOT mailmap-canonicalized (%aN/%aE):
            # `git commit -s` writes the literal identity, so canonicalizing
            # here makes the check unpassable for any mailmapped author.
            author=$(git show -s --format='%an <%ae>' "$commit")
            committer=$(git show -s --format='%cn <%ce>' "$commit")
            message=$(git show -s --format=%B "$commit")
            if [ "$PR_AUTHOR" = "dependabot[bot]" ] && \
               [ "$author" = "dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>" ]; then
              continue
            fi
            if ! grep -Fqx "Signed-off-by: $author" <<< "$message" && \
               ! grep -Fqx "Signed-off-by: $committer" <<< "$message"; then
              echo "::error::Commit $commit must be signed off by its author or committer. Use git commit -s."
              failed=1
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")
          exit "$failed"
