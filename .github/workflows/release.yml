name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options: [beta, stable]
      bump:
        description: Version bump
        required: true
        type: choice
        options: [patch, minor, major, promote]

concurrency:
  group: release
  cancel-in-progress: false

env:
  NO_TELEMETRY: "1"

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Compute version
        id: version
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          bun -e '
            import { computeNextVersion, resolveCurrentVersion } from "./scripts/release.ts";
            const pkg = await Bun.file("apps/cli/package.json").json();
            const current = await resolveCurrentVersion(pkg.version);
            const version = computeNextVersion(current, process.env.INPUT_CHANNEL, process.env.INPUT_BUMP);
            console.log("version=" + version);
            console.log("tag=v" + version);
            console.log("prerelease=" + (process.env.INPUT_CHANNEL === "beta"));
          ' >> "$GITHUB_OUTPUT"

      # This workflow cannot land the bump itself. `main` is covered by a
      # ruleset with an empty bypass list, so the job can neither push to it nor
      # open the PR for it. Releasing therefore reads the version off main
      # rather than stamping it, and refuses to tag a commit that disagrees --
      # otherwise the tag would carry a bump reachable from nowhere else and
      # main would silently stay a release behind (which is how it reached
      # 0.0.82 while v0.0.83 was the published release).
      - name: Verify main already carries this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Resolve main from the remote rather than trusting whatever refs
          # actions/checkout happened to create.
          git fetch --no-tags origin main
          tip=$(git rev-parse FETCH_HEAD)
          # Equality, not ancestry: ancestry alone would also accept the bump
          # commit itself once main has moved past it, and the release would
          # then ship an older tree than main under a fresh tag. The tag job
          # relaxes this to ancestry so a merge during the quality gate cannot
          # abort a release that was already validated here.
          if [ "$(git rev-parse HEAD)" != "$tip" ]; then
            echo "::error::${GITHUB_SHA} is not the current tip of main (${tip}). Dispatch the release from main."
            exit 1
          fi

          # Reuses the same SYNCED_MANIFESTS list the local `make release`
          # preflight uses, so the two can never disagree about what "carries
          # this version" means. Throws if a manifest is missing entirely.
          # shellcheck disable=SC2016  # ${v} is a JS template literal, not shell
          bun -e '
            import { manifestsCarry } from "./scripts/release.ts";
            const v = process.env.VERSION;
            if (!(await manifestsCarry(v))) {
              console.log(`::error::main does not carry v${v}. Land the bump on main first (\`make release\` opens that PR), then re-dispatch.`);
              process.exit(1);
            }
          '

          # Also fails if .claude-plugin/marketplace.json stops redirecting the
          # old marketplace to squirrelscan/skills, where the plugins live now.
          bun run scripts/sync-plugin-manifests.ts --check

  quality:
    name: Release quality gate
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      # No manifest stamping: the `version` job has already established that the
      # checked-out tree carries $VERSION, so the gate runs against exactly the
      # bytes that will be tagged.
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run notices:check
      - run: bun run audit:dependencies
      - run: bun test
      - run: bun run test:engine
      - run: bun run test:release

  tag:
    name: Create release tag
    needs: [version, quality]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun

      # Re-checked here, not just in `version`: this job checks out again, and
      # tagging the wrong commit is the one failure the later jobs cannot undo.
      # Ancestry rather than tip-equality: `version` already proved this commit
      # was the tip when the release started, and main may legitimately have
      # advanced while the quality gate ran.
      - name: Re-verify the commit being tagged
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::${GITHUB_SHA} is not on main; refusing to tag it."
            exit 1
          fi
          # shellcheck disable=SC2016  # ${v} is a JS template literal, not shell
          bun -e '
            import { manifestsCarry } from "./scripts/release.ts";
            const v = process.env.VERSION;
            if (!(await manifestsCarry(v))) {
              console.log(`::error::the commit being tagged does not carry v${v}.`);
              process.exit(1);
            }
          '
          bun run scripts/sync-plugin-manifests.ts --check

      - name: Tag the release commit
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          # A tag that already exists means this version was released before.
          # The tag ruleset blocks deletion and non-fast-forward, so the push
          # would fail anyway -- fail here with a message that says why.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} already exists on origin. Nothing was pushed."
            exit 1
          fi

          git tag "$TAG"
          # Explicit refspec so a same-named branch can never be pushed instead.
          git push origin "refs/tags/${TAG}:refs/tags/${TAG}"

  build:
    name: Build release binaries
    needs: [version, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: ./.github/actions/setup-bun

      # `make build-all` re-signs the darwin binaries after compiling them
      # (#2310), and this job runs on Linux, where Apple's `codesign` does not
      # exist. rcodesign is pinned by version AND by digest: a release must
      # never be able to pull down a different signing tool than the reviewed
      # one, and `cargo install` at release time would do exactly that.
      - name: Install rcodesign
        env:
          RCODESIGN_VERSION: 0.29.0
          RCODESIGN_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002 # pragma: allowlist secret
        run: |
          set -euo pipefail
          tarball="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --max-redirs 3 -fsSL \
            -o "$tarball" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${tarball}"
          echo "${RCODESIGN_SHA256}  ${tarball}" | sha256sum --check --status
          tar xzf "$tarball"
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 \
            "apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl/rcodesign" \
            "${RUNNER_TEMP}/bin/rcodesign"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/rcodesign" --version

      - name: Build all platforms
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: make build-all VERSION="$VERSION"
      # Signing happens inside `make build-all`, so the hashes below are taken
      # from the signed bytes. Never move this step above the build.
      - name: Generate manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: make manifest VERSION="$VERSION"
      - name: Stage release assets
        run: |
          mkdir release-assets
          cp apps/cli/build/squirrel-* apps/cli/build/manifest.json LICENSE THIRD_PARTY_NOTICES.md release-assets/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: release-assets/

  # The authoritative signature gate, and the only place in the pipeline where
  # Apple's own verifier exists. It runs BEFORE anything publishes, so a build
  # whose darwin assets do not verify can no longer reach users (#2310). It
  # also re-hashes the two assets against the manifest, which is what proves
  # the manifest was generated from the signed bytes rather than the
  # pre-signing ones.
  verify-darwin:
    name: Verify darwin signatures
    needs: [version, build]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: release-assets
      - name: Verify signatures and manifest hashes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            file="release-assets/squirrel-${VERSION}-darwin-${arch}"
            if [ ! -f "$file" ]; then
              echo "::error::${file} is missing from the release artifact"
              exit 1
            fi
            # upload-artifact drops the executable bit; restoring it does not
            # touch the bytes, so the hash below is still the published one.
            chmod +x "$file"
            codesign -dv "$file" 2>&1 || true
            if ! codesign --verify --strict "$file"; then
              echo "::error::${file} is not validly signed. Nothing was published."
              exit 1
            fi
            recorded=$(jq -r ".binaries[\"darwin-${arch}\"].sha256 // \"\"" release-assets/manifest.json)
            actual=$(shasum -a 256 "$file" | cut -d' ' -f1)
            if [ "$recorded" != "$actual" ]; then
              echo "::error::manifest.json records ${recorded} for darwin-${arch}, the asset hashes to ${actual}. The manifest was generated before signing."
              exit 1
            fi
            echo "darwin-${arch}: signature valid, manifest hash matches"
          done
      # macos-latest runners are arm64, so the asset that was being SIGKILLed
      # in the field is the one this executes.
      - name: Run the signed arm64 binary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          home=$(mktemp -d)
          HOME="$home" "./release-assets/squirrel-${VERSION}-darwin-arm64" --version

  github-release:
    name: Publish GitHub release
    needs: [version, build, verify-darwin]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: release-assets
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Resolve release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes=$(awk -v "v=$VERSION" -f scripts/extract-changelog.awk CHANGELOG.md)
          if [ -z "${notes//[[:space:]]/}" ]; then
            notes="squirrelscan v${VERSION}"
          fi
          printf '%s\n' "$notes" > release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flag=()
          if [ "$PRERELEASE" = true ]; then flag+=(--prerelease); fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${flag[@]}" \
            release-assets/squirrel-* \
            release-assets/manifest.json \
            release-assets/LICENSE \
            release-assets/THIRD_PARTY_NOTICES.md

  npm:
    name: Publish npm package
    needs: [version, github-release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - name: Publish with provenance
        working-directory: npm
        run: npm publish --access public --provenance

  installers-publish:
    name: Publish installers and channel metadata
    needs: [version, github-release]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      # wrangler >= 4.99 requires Node 22+; runners default to Node 20.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: release-assets

      # install.squirrelscan.com serves the install scripts and the per-channel
      # "latest release" metadata from R2, because resolving a version through
      # api.github.com is capped at 60 req/hr per IP and users behind shared
      # egress (corporate NAT, VPN, CI) get 403s. R2 is only correct while
      # something keeps writing to it, and that is this job.
      - name: Build per-channel manifests
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The build job generates one manifest.json and it always carries
          # channel="stable". The beta channel serves every release, so its copy
          # has to be restamped: a channels/beta.json that says "stable" is how
          # the two keys ended up byte-identical last time.
          jq '.channel = "beta"' release-assets/manifest.json > channel-beta.json
          if [ "$PRERELEASE" != "true" ]; then
            jq '.channel = "stable"' release-assets/manifest.json > channel-stable.json
          fi

      - name: Publish installers and channel metadata to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

          put() {
            npx --yes wrangler@4.99.0 r2 object put "squirrelscan-installers/$1" \
              --file "$2" --content-type "$3" --remote
          }

          put install.sh install.sh "text/x-shellscript; charset=utf-8"
          put install.ps1 install.ps1 "text/plain; charset=utf-8"

          # Beta tracks every release; stable only non-prereleases. This mirrors
          # the worker's GitHub fallback (beta accepts prereleases, stable does
          # not) so the primary and fallback paths can never disagree about what
          # a channel means.
          put channels/beta.json channel-beta.json "application/json; charset=utf-8"
          if [ "$PRERELEASE" != "true" ]; then
            put channels/stable.json channel-stable.json "application/json; charset=utf-8"
          fi

      # Writing to a bucket proves nothing about the bucket the deployed worker
      # reads: they are separate configs and can point at different accounts.
      # Assert the pairing against the live endpoint instead of assuming it.
      - name: Verify the live endpoint serves this release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          verify() {
            channel="$1"
            got_version="" got_channel=""
            # Responses are edge-cached for 300s, so a colo that answered before
            # the upload can keep serving the previous object for a few minutes.
            # Poll past that window rather than racing it.
            for _ in $(seq 1 24); do
              body=$(curl -fsS "https://install.squirrelscan.com/releases/${channel}" || true)
              got_version=$(printf '%s' "$body" | jq -r '.version // ""' 2>/dev/null || true)
              got_channel=$(printf '%s' "$body" | jq -r '.channel // ""' 2>/dev/null || true)
              if [ "$got_version" = "$VERSION" ] && [ "$got_channel" = "$channel" ]; then
                echo "/releases/${channel} -> ${got_version} (${got_channel})"
                return 0
              fi
              sleep 20
            done
            echo "::error::/releases/${channel} reports version='${got_version}' channel='${got_channel}', expected version='${VERSION}' channel='${channel}'"
            return 1
          }

          verify beta
          if [ "$PRERELEASE" != "true" ]; then
            verify stable
          fi

  hosted-release-refresh:
    name: Refresh hosted release cache
    needs: [version, github-release]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Notify private website
        env:
          RELEASE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
        run: |
          test -n "$RELEASE_WEBHOOK_SECRET"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${RELEASE_WEBHOOK_SECRET}" \
            --header "Content-Type: application/json" \
            https://squirrelscan.com/api/release-refresh

  install-tests:
    name: Verify installers
    needs: [version, github-release]
    uses: ./.github/workflows/test-install.yml
    with:
      version: ${{ needs.version.outputs.tag }}
