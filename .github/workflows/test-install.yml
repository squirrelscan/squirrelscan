name: Test Install Script

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to test (e.g., v0.0.15). Leave empty for latest.'
        required: false
        type: string
      installer_url:
        description: 'install.sh to pipe into bash. Empty uses the script in the git tree on main.'
        required: false
        type: string
      installer_ps1_url:
        description: 'install.ps1 to run. Empty uses the script in the git tree on main.'
        required: false
        type: string
      verify_channel:
        description: >-
          When set (stable or beta), additionally assert that the installed
          binary matches that channel's published manifest. Empty skips it.
        required: false
        type: string
    outputs:
      failed:
        description: >-
          Space-separated list of platforms that failed, for a caller that has
          to say more than "the run went red" (installer-canary.yml files it in
          an issue). Empty when everything required passed.
        value: ${{ jobs.summary.outputs.failed }}
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test (e.g., v0.0.15). Leave empty for latest.'
        required: false
        type: string
      installer_url:
        description: 'install.sh to pipe into bash. Empty uses the script in the git tree on main.'
        required: false
        type: string
      installer_ps1_url:
        description: 'install.ps1 to run. Empty uses the script in the git tree on main.'
        required: false
        type: string
      verify_channel:
        description: 'stable or beta to assert against that channel manifest. Empty skips it.'
        required: false
        type: string

permissions:
  contents: read

env:
  NO_TELEMETRY: "1"
  # The release path tests the script as it sits on main against a version that
  # was built minutes ago. The canary (installer-canary.yml) overrides these
  # with the documented one-liner so it exercises what a user actually runs:
  # the worker-served script, the live channel metadata and the CDN, none of
  # which the release path touches.
  DEFAULT_INSTALL_SH: https://raw.githubusercontent.com/squirrelscan/squirrelscan/main/install.sh
  DEFAULT_INSTALL_PS1: https://raw.githubusercontent.com/squirrelscan/squirrelscan/main/install.ps1

jobs:
  test-install-linux-glibc:
    name: Linux (glibc)
    runs-on: ubuntu-latest
    env:
      TEST_VERSION: ${{ inputs.version }}
    steps:
      # Only for the local composite action below, so the release path keeps
      # doing exactly what it did: install, verify, no repository checkout.
      - name: Checkout
        if: inputs.verify_channel != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create test user
        run: |
          sudo useradd -m -s /bin/bash testuser
          sudo mkdir -p /home/testuser/.local/bin
          sudo chown -R testuser:testuser /home/testuser

      # INSTALL_URL is a step env, not a job env: the `env` context (which is
      # where the default lives) is not available in `jobs.<id>.env`.
      - name: Install squirrel as test user
        env:
          INSTALL_URL: ${{ inputs.installer_url || env.DEFAULT_INSTALL_SH }}
        run: |
          sudo -u testuser bash -c "
            export HOME=/home/testuser
            export PATH=/home/testuser/.local/bin:\$PATH
            if [ -n '$TEST_VERSION' ]; then
              export SQUIRREL_VERSION='$TEST_VERSION'
            fi
            curl -fsSL '$INSTALL_URL' | bash
          "

      - name: Verify installation
        run: |
          # Verify binary exists
          sudo -u testuser test -f /home/testuser/.local/bin/squirrel || \
            sudo -u testuser test -L /home/testuser/.local/bin/squirrel

          # Verify squirrel runs
          sudo -u testuser bash -c "
            export HOME=/home/testuser
            export PATH=/home/testuser/.local/bin:\$PATH
            squirrel --version
          "

      - name: Verify against the published channel manifest
        if: inputs.verify_channel != ''
        uses: ./.github/actions/verify-installed-squirrel
        with:
          channel: ${{ inputs.verify_channel }}
          platform: linux-x64
          binary: /home/testuser/.local/bin/squirrel
          home: /home/testuser
          run-as: testuser

      - name: Verify version output
        run: |
          VERSION_OUTPUT=$(sudo -u testuser bash -c "
            export HOME=/home/testuser
            export PATH=/home/testuser/.local/bin:\$PATH
            squirrel self version --json
          ")
          echo "Version info: $VERSION_OUTPUT"

          # Verify it's valid JSON with expected fields
          echo "$VERSION_OUTPUT" | jq -e '.version' > /dev/null
          echo "$VERSION_OUTPUT" | jq -e '.platform' > /dev/null

      - name: Run self doctor
        run: |
          sudo -u testuser bash -c "
            export HOME=/home/testuser
            export PATH=/home/testuser/.local/bin:\$PATH
            squirrel self doctor
          "

  test-install-linux-musl:
    name: Linux (musl/Alpine)
    runs-on: ubuntu-latest
    # Advisory on the release path, where the musl binary for the version under
    # test may not be published yet. Not advisory for the canary: it installs
    # whatever stable currently advertises, the channel manifest has carried
    # linux-x64-musl for a long time now, and a canary that cannot go red for a
    # platform is not watching it.
    continue-on-error: ${{ inputs.verify_channel == '' }}
    container:
      image: alpine:latest
    env:
      TEST_VERSION: ${{ inputs.version }}
    steps:
      - name: Install dependencies
        run: |
          # libstdc++ is the runtime the musl binary links against (#163) —
          # a real Alpine box needs it; install.sh auto-adds it as root, but the
          # test installs as a non-root user, so provision it here.
          apk add --no-cache curl bash sudo shadow jq libstdc++

      - name: Create test user
        run: |
          adduser -D -s /bin/bash testuser
          mkdir -p /home/testuser/.local/bin
          chown -R testuser:testuser /home/testuser
          echo "testuser ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

      # No manifest verification on this leg, and deliberately so: the job runs
      # in an Alpine container, where checking the repository out (which the
      # local composite action needs) is its own source of breakage, and the
      # job is `continue-on-error` anyway, so an assertion here could never
      # fail a run. Promoting musl to a required leg is a separate decision.
      - name: Install squirrel as test user
        env:
          INSTALL_URL: ${{ inputs.installer_url || env.DEFAULT_INSTALL_SH }}
        run: |
          su - testuser -c "
            export PATH=/home/testuser/.local/bin:\$PATH
            if [ -n '$TEST_VERSION' ]; then
              export SQUIRREL_VERSION='$TEST_VERSION'
            fi
            curl -fsSL '$INSTALL_URL' | bash
          "

      - name: Verify installation
        run: |
          su - testuser -c "
            export PATH=/home/testuser/.local/bin:\$PATH
            squirrel --version
          "

      - name: Verify version output
        run: |
          VERSION_OUTPUT=$(su - testuser -c "
            export PATH=/home/testuser/.local/bin:\$PATH
            squirrel self version --json
          ")
          echo "Version info: $VERSION_OUTPUT"

          # Verify platform shows musl
          echo "$VERSION_OUTPUT" | jq -e '.platform | contains("musl")' > /dev/null || \
            echo "Warning: Platform doesn't contain 'musl' - may be expected if musl binary not published"

      - name: Run self doctor
        run: |
          su - testuser -c "
            export PATH=/home/testuser/.local/bin:\$PATH
            squirrel self doctor
          "

  test-install-macos-arm64:
    name: macOS (arm64)
    runs-on: macos-latest
    env:
      TEST_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Only for the local composite action below, so the release path keeps
      # doing exactly what it did: install, verify, no repository checkout.
      - name: Checkout
        if: inputs.verify_channel != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create test user
        run: |
          # Create a test user on macOS.
          # dscl can transiently fail with eNotYetImplemented on fresh runner
          # images (Directory Services flake), so retry up to 3 times.
          create_test_user() {
            sudo dscl . -create /Users/testuser &&
              sudo dscl . -create /Users/testuser UserShell /bin/bash &&
              sudo dscl . -create /Users/testuser RealName "Test User" &&
              sudo dscl . -create /Users/testuser UniqueID 1001 &&
              sudo dscl . -create /Users/testuser PrimaryGroupID 20 &&
              sudo dscl . -create /Users/testuser NFSHomeDirectory /Users/testuser
          }

          for attempt in 1 2 3; do
            echo "Creating test user (attempt $attempt/3)..."
            if create_test_user; then
              echo "Test user created on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to create test user after 3 attempts"
              exit 1
            fi
            echo "dscl failed (transient Directory Services flake), cleaning up and retrying in 5s..."
            sudo dscl . -delete /Users/testuser 2>/dev/null || true
            sleep 5
          done

          sudo mkdir -p /Users/testuser
          sudo chown -R testuser:staff /Users/testuser

      - name: Install squirrel as test user
        env:
          INSTALL_URL: ${{ inputs.installer_url || env.DEFAULT_INSTALL_SH }}
        run: |
          sudo -u testuser bash -c "
            export HOME=/Users/testuser
            export GITHUB_TOKEN='$GH_TOKEN'
            mkdir -p /Users/testuser/.local/bin
            export PATH=/Users/testuser/.local/bin:\$PATH
            if [ -n '$TEST_VERSION' ]; then
              export SQUIRREL_VERSION='$TEST_VERSION'
            fi
            curl -fsSL '$INSTALL_URL' | bash
          "

      - name: Verify installation
        run: |
          # Verify binary exists
          sudo -u testuser test -f /Users/testuser/.local/bin/squirrel || \
            sudo -u testuser test -L /Users/testuser/.local/bin/squirrel

          # Verify squirrel runs
          sudo -u testuser bash -c "
            export HOME=/Users/testuser
            export PATH=/Users/testuser/.local/bin:\$PATH
            squirrel --version
          "

      - name: Verify against the published channel manifest
        if: inputs.verify_channel != ''
        uses: ./.github/actions/verify-installed-squirrel
        with:
          channel: ${{ inputs.verify_channel }}
          platform: darwin-arm64
          binary: /Users/testuser/.local/bin/squirrel
          home: /Users/testuser
          run-as: testuser

      # The end-to-end version of the release workflow's signature gate: this
      # checks the binary as it actually lands on a user's disk. `bun build
      # --compile` used to leave the linker's ad-hoc signature describing the
      # file as it was before the bundle was appended, and macOS killed the
      # result outright on machines that enforce signatures (#2310).
      - name: Verify the installed binary is validly signed
        run: |
          sudo -u testuser bash -c '
            set -eu
            export HOME=/Users/testuser
            target=$(readlink -f "$HOME/.local/bin/squirrel")
            codesign -dv "$target" 2>&1 || true
            codesign --verify --strict "$target"
          '

      - name: Verify version output
        run: |
          VERSION_OUTPUT=$(sudo -u testuser bash -c "
            export HOME=/Users/testuser
            export PATH=/Users/testuser/.local/bin:\$PATH
            squirrel self version --json
          ")
          echo "Version info: $VERSION_OUTPUT"

          # Verify it's valid JSON with expected fields
          echo "$VERSION_OUTPUT" | jq -e '.version' > /dev/null
          echo "$VERSION_OUTPUT" | jq -e '.platform | contains("darwin")' > /dev/null

      - name: Run self doctor
        run: |
          sudo -u testuser bash -c "
            export HOME=/Users/testuser
            export PATH=/Users/testuser/.local/bin:\$PATH
            squirrel self doctor
          "

  test-install-macos-x64:
    name: macOS (x64)
    runs-on: macos-15-intel  # x64 runner
    env:
      TEST_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Only for the local composite action below, so the release path keeps
      # doing exactly what it did: install, verify, no repository checkout.
      - name: Checkout
        if: inputs.verify_channel != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create test user
        run: |
          # Create a test user on macOS.
          # dscl can transiently fail with eNotYetImplemented on fresh runner
          # images (Directory Services flake; broke v0.0.41), so retry up to 3 times.
          create_test_user() {
            sudo dscl . -create /Users/testuser &&
              sudo dscl . -create /Users/testuser UserShell /bin/bash &&
              sudo dscl . -create /Users/testuser RealName "Test User" &&
              sudo dscl . -create /Users/testuser UniqueID 1001 &&
              sudo dscl . -create /Users/testuser PrimaryGroupID 20 &&
              sudo dscl . -create /Users/testuser NFSHomeDirectory /Users/testuser
          }

          for attempt in 1 2 3; do
            echo "Creating test user (attempt $attempt/3)..."
            if create_test_user; then
              echo "Test user created on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to create test user after 3 attempts"
              exit 1
            fi
            echo "dscl failed (transient Directory Services flake), cleaning up and retrying in 5s..."
            sudo dscl . -delete /Users/testuser 2>/dev/null || true
            sleep 5
          done

          sudo mkdir -p /Users/testuser
          sudo chown -R testuser:staff /Users/testuser

      - name: Install squirrel as test user
        env:
          INSTALL_URL: ${{ inputs.installer_url || env.DEFAULT_INSTALL_SH }}
        run: |
          sudo -u testuser bash -c "
            export HOME=/Users/testuser
            export GITHUB_TOKEN='$GH_TOKEN'
            mkdir -p /Users/testuser/.local/bin
            export PATH=/Users/testuser/.local/bin:\$PATH
            if [ -n '$TEST_VERSION' ]; then
              export SQUIRREL_VERSION='$TEST_VERSION'
            fi
            curl -fsSL '$INSTALL_URL' | bash
          "

      - name: Verify installation
        run: |
          sudo -u testuser test -f /Users/testuser/.local/bin/squirrel || \
            sudo -u testuser test -L /Users/testuser/.local/bin/squirrel

          sudo -u testuser bash -c "
            export HOME=/Users/testuser
            export PATH=/Users/testuser/.local/bin:\$PATH
            squirrel --version
          "

      - name: Verify against the published channel manifest
        if: inputs.verify_channel != ''
        uses: ./.github/actions/verify-installed-squirrel
        with:
          channel: ${{ inputs.verify_channel }}
          platform: darwin-x64
          binary: /Users/testuser/.local/bin/squirrel
          home: /Users/testuser
          run-as: testuser

      # Same gate as the arm64 leg (#2310): the darwin-x64 asset carried the
      # same stale ad-hoc signature.
      - name: Verify the installed binary is validly signed
        run: |
          sudo -u testuser bash -c '
            set -eu
            export HOME=/Users/testuser
            target=$(readlink -f "$HOME/.local/bin/squirrel")
            codesign -dv "$target" 2>&1 || true
            codesign --verify --strict "$target"
          '

      - name: Verify version output
        run: |
          VERSION_OUTPUT=$(sudo -u testuser bash -c "
            export HOME=/Users/testuser
            export PATH=/Users/testuser/.local/bin:\$PATH
            squirrel self version --json
          ")
          echo "Version info: $VERSION_OUTPUT"
          echo "$VERSION_OUTPUT" | jq -e '.version' > /dev/null
          echo "$VERSION_OUTPUT" | jq -e '.platform | contains("darwin-x64")' > /dev/null

      - name: Run self doctor
        run: |
          sudo -u testuser bash -c "
            export HOME=/Users/testuser
            export PATH=/Users/testuser/.local/bin:\$PATH
            squirrel self doctor
          "

  test-install-windows:
    name: Windows (PowerShell)
    runs-on: windows-latest
    env:
      TEST_VERSION: ${{ inputs.version }}
    steps:
      # Only for the local composite action below, so the release path keeps
      # doing exactly what it did: install, verify, no repository checkout.
      - name: Checkout
        if: inputs.verify_channel != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create test user
        shell: pwsh
        run: |
          # Create local test user
          $Password = ConvertTo-SecureString "T3stP@ssw0rd!Secure2026" -AsPlainText -Force
          New-LocalUser -Name "testuser" -Password $Password -FullName "Test User" -Description "Test user for install"
          Add-LocalGroupMember -Group "Users" -Member "testuser"

      - name: Install squirrel as test user
        shell: pwsh
        env:
          INSTALL_PS1_URL: ${{ inputs.installer_ps1_url || env.DEFAULT_INSTALL_PS1 }}
        run: |
          # Run install script as test user using runas
          $cred = New-Object System.Management.Automation.PSCredential("testuser", (ConvertTo-SecureString "T3stP@ssw0rd!Secure2026" -AsPlainText -Force))

          # Create user profile directory
          $userProfile = "C:\Users\testuser"
          if (-not (Test-Path $userProfile)) {
            New-Item -ItemType Directory -Path $userProfile -Force | Out-Null
          }

          # Download and run install script
          $installScript = @"
          `$ErrorActionPreference = 'Stop'
          `$env:USERPROFILE = 'C:\Users\testuser'
          `$env:LOCALAPPDATA = 'C:\Users\testuser\AppData\Local'
          if ('$env:TEST_VERSION') {
            `$env:SQUIRREL_VERSION = '$env:TEST_VERSION'
          }

          # Create required directories
          New-Item -ItemType Directory -Path `$env:LOCALAPPDATA -Force | Out-Null

          # Download and execute install script
          Invoke-WebRequest -Uri '$env:INSTALL_PS1_URL' -OutFile 'C:\Users\testuser\install.ps1'
          & 'C:\Users\testuser\install.ps1'
          "@

          $installScript | Out-File -FilePath "C:\Users\testuser\run-install.ps1" -Encoding UTF8

          # Execute as the test user (simplified - run in current context with modified env)
          $env:USERPROFILE = "C:\Users\testuser"
          $env:LOCALAPPDATA = "C:\Users\testuser\AppData\Local"
          if ($env:TEST_VERSION) {
            $env:SQUIRREL_VERSION = $env:TEST_VERSION
          }

          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null

          Invoke-WebRequest -Uri $env:INSTALL_PS1_URL -OutFile 'C:\Users\testuser\install.ps1'
          & 'C:\Users\testuser\install.ps1'

      - name: Verify installation
        shell: pwsh
        run: |
          $binPath = "C:\Users\testuser\AppData\Local\squirrel\bin\squirrel.exe"

          # Check binary exists
          if (-not (Test-Path $binPath)) {
            Write-Error "Binary not found at $binPath"
            exit 1
          }

          # Verify squirrel runs
          & $binPath --version

      - name: Verify against the published channel manifest
        if: inputs.verify_channel != ''
        uses: ./.github/actions/verify-installed-squirrel
        with:
          channel: ${{ inputs.verify_channel }}
          platform: windows-x64
          binary: C:\Users\testuser\AppData\Local\squirrel\bin\squirrel.exe
          home: C:\Users\testuser

      - name: Verify version output
        shell: pwsh
        run: |
          $binPath = "C:\Users\testuser\AppData\Local\squirrel\bin\squirrel.exe"
          $versionJson = & $binPath self version --json | ConvertFrom-Json

          Write-Host "Version info: $($versionJson | ConvertTo-Json)"

          # Verify fields exist
          if (-not $versionJson.version) {
            Write-Error "Missing version field"
            exit 1
          }
          if ($versionJson.platform -notlike "*windows*") {
            Write-Error "Platform doesn't contain 'windows': $($versionJson.platform)"
            exit 1
          }

          Write-Host "Verification passed!"

      - name: Run self doctor
        shell: pwsh
        run: |
          # Set env to match install context
          $env:USERPROFILE = "C:\Users\testuser"
          $env:LOCALAPPDATA = "C:\Users\testuser\AppData\Local"
          $binPath = "C:\Users\testuser\AppData\Local\squirrel\bin\squirrel.exe"
          & $binPath self doctor

  summary:
    name: Test Summary
    needs: [test-install-linux-glibc, test-install-linux-musl, test-install-macos-arm64, test-install-macos-x64, test-install-windows]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.results.outputs.failed }}
    steps:
      - name: Check results
        id: results
        env:
          LINUX_GLIBC: ${{ needs.test-install-linux-glibc.result }}
          LINUX_MUSL: ${{ needs.test-install-linux-musl.result }}
          MACOS_ARM64: ${{ needs.test-install-macos-arm64.result }}
          MACOS_X64: ${{ needs.test-install-macos-x64.result }}
          WINDOWS: ${{ needs.test-install-windows.result }}
          VERIFY_CHANNEL: ${{ inputs.verify_channel }}
        run: |
          {
            echo "## Install Test Results"
            echo ""
            echo "| Platform | Status |"
            echo "|----------|--------|"
            echo "| Linux (glibc) | ${LINUX_GLIBC} |"
            echo "| Linux (musl) | ${LINUX_MUSL} |"
            echo "| macOS (arm64) | ${MACOS_ARM64} |"
            echo "| macOS (x64) | ${MACOS_X64} |"
            echo "| Windows | ${WINDOWS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail if any required job failed. musl is advisory only on the
          # release path, where its binary may not be published yet; the canary
          # sets verify_channel and holds it to the same bar as the rest.
          failed=""
          if [ "$LINUX_GLIBC" = "failure" ]; then failed="$failed linux-glibc"; fi
          if [ "$MACOS_ARM64" = "failure" ]; then failed="$failed macos-arm64"; fi
          if [ "$MACOS_X64" = "failure" ]; then failed="$failed macos-x64"; fi
          if [ "$WINDOWS" = "failure" ]; then failed="$failed windows"; fi
          if [ -n "$VERIFY_CHANNEL" ] && [ "$LINUX_MUSL" = "failure" ]; then failed="$failed linux-musl"; fi

          # Written before the exit below: the caller reads this output to say
          # WHICH platform broke, and a job that failed without setting it would
          # leave the canary's issue saying only that something went red.
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

          if [ -n "$failed" ]; then
            echo ""
            echo "One or more required tests failed!"
            exit 1
          fi
